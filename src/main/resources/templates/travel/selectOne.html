<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <script type="text/javascript" src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script th:if="${!#strings.isEmpty(kakaoMapJavascriptKey)}" th:src="@{https://dapi.kakao.com/v2/maps/sdk.js(appkey=${kakaoMapJavascriptKey},libraries=services)}"></script>

  <script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof kakao === 'undefined' || !kakao.maps || !kakao.maps.services) return;
      var container = document.getElementById('kakaoMap');
      if (!container) return;
      var address = /*[[${vo2 != null ? vo2.address : ''}]]*/ '';
      var relationAddrs = /*[[${relationaddr}]]*/ '';
      var relationTitles = /*[[${relationTitle}]]*/ '';
      var map = new kakao.maps.Map(container, {
        center: new kakao.maps.LatLng(37.5665, 126.9780), level: 5
      });
      // The browser SDK uses a domain-restricted JavaScript key, never a REST key.
      var geocoder = new kakao.maps.services.Geocoder();
      function addMarker(addr, title, main) {
        if (!addr || !addr.trim()) return;
        geocoder.addressSearch(addr.trim(), function (result, status) {
          if (status !== kakao.maps.services.Status.OK || !result.length) return;
          var position = new kakao.maps.LatLng(result[0].y, result[0].x);
          var marker = new kakao.maps.Marker({map: map, position: position});
          if (main) { map.setCenter(position); return; }
          // Treat API-derived titles as text, not executable markup.
          var label = document.createElement('div');
          label.textContent = title || '관련 장소';
          var info = new kakao.maps.InfoWindow({content: label.outerHTML});
          var open = false;
          kakao.maps.event.addListener(marker, 'click', function () {
            if (open) info.close(); else info.open(map, marker);
            open = !open;
          });
        });
      }
      addMarker(address, '', true);
      var titles = (relationTitles || '').split(/\n/);
      (relationAddrs || '').split(/\n/).forEach(function (addr, index) {
        addMarker(addr, titles[index], false);
      });
    });
  </script>
</head>
<body th:replace="~{layout::layout}">
<div th:fragment="content">
  <h1>관광명소 상세 페이지</h1>
  <div th:if="${vo2 == null}" class="alert alert-warning">
    데이터를 찾을 수 없습니다. 관광명소 데이터가 존재하지 않습니다.
  </div>

  <table id="customers" th:if="${vo2 != null}">
    <thead>
    <tr>
      <th>no</th>
      <th>district</th>
      <th>title</th>
      <th>description</th>
      <th>address</th>
      <th>phone</th>
    </tr>
    </thead>
    <tbody>
    <tr>
      <td th:text="${vo2.no}"></td>
      <td th:text="${vo2.district}"></td>
      <td th:text="${vo2.title}"></td>
      <td th:text="${vo2.description}"></td>
      <td th:text="${vo2.address}"></td>
      <td th:text="${vo2.phone}"></td>
    </tr>
    <tr>
      <td colspan="2">관광지 이미지</td>
      <td colspan="4">
        <th:block th:if="${imageUrl != 'No image available'}">
          <img id="dynamicImage" th:src="${imageUrl}" width="200" alt="Image">
        </th:block>
        <th:block th:if="${imageUrl == 'No image available'}">
          <p>이미지가 없습니다.</p>
        </th:block>
      </td>
    </tr>

    <td colspan="2">연관 관광명소</td>
    <td colspan="4" th:if="${relationTitle != ''}" th:text="${#strings.listJoin(relationTitle.split('\n'), ', ')}"></td>
    <td colspan="4" th:unless="${relationTitle != ''}">관광명소가 없습니다.</td>
    </td>
    <tr>
      <td colspan="2">카카오 맵</td>
      <td colspan="4" th:rowspan="5">
        <div id="kakaoMap" style="width:500px;height:400px;"></div>
      </td>
    </tr>
    </tbody>
    <tfoot>
    <tr>
      <td colspan="5">
        <a th:href="@{/travel/update(no=${vo2.no})}">관광지수정</a>
        <a th:href="@{/travel/delete(no=${vo2.no})}">관광지삭제</a>
      </td>
    </tr>
    </tfoot>
  </table>
</div>
</body>
</html>
